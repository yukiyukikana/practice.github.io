<section class="hero"><div class="container">
  <h1>Our Team</h1>
  <p>Meet the people behind our work.</p>
</div></section>

<main><div class="container">
  <div class="grid">

    <div class="card member" role="button" tabindex="0" data-modal="m1">
      <img src="/assets/img/team/member1.jpg" alt="Photo of Member Name">
      <div class="card-body">
        <h3>Member Name</h3>
        <p class="role">Executive Director</p>
        <p>Two short sentences about this person.</p>
        <span class="more">Read more →</span>
      </div>
    </div>

    <!-- Repeat the card above for m2, m3, m4 -->
  </div>

  <dialog id="m1"><div class="modal-body">
    <img src="/assets/img/team/member1.jpg" alt="Photo of Member Name">
    <h2>Member Name</h2>
    <p class="role">Executive Director</p>
    <p>Write the full biography here. You can use several paragraphs.</p>
    <button class="close">Close</button>
  </div></dialog>

  <!-- Repeat the dialog above for m2, m3, m4 -->
</div></main>
